<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 76" width="600" height="67">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="165" y="14" width="485" height="48">
        <animate attributeName="width" values="0;485;485;0;0" keyTimes="0;0.42;0.82;0.94;1" dur="7.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Outer White/Silver Framed Pill (exact Harness2 geometry in grey & white) -->
  <rect x="3" y="3" width="674" height="70" rx="14" ry="14" fill="url(#termBg)" stroke="#e5e7eb" stroke-width="2"/>

  <!-- 3 Minimal Grey/Silver Dots on Left -->
  <circle cx="34" cy="38" r="4.8" fill="#6b7280"/>
  <circle cx="52" cy="38" r="4.8" fill="#9ca3af"/>
  <circle cx="70" cy="38" r="4.8" fill="#d1d5db"/>

  <!-- Subtle Vertical Divider -->
  <line x1="100" y1="22" x2="100" y2="54" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Prompt Symbol "$" in Silver-Grey -->
  <text x="126" y="46" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace" font-size="23" font-weight="600" fill="#9ca3af">$</text>

  <!-- Animated Command Text in Crisp White & Light Grey -->
  <g clip-path="url(#typeClip)" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace" font-size="22" font-weight="500">
    <text x="165" y="46" fill="#f9fafb">
      <tspan fill="#d1d5db">claude</tspan>
      <tspan fill="#f9fafb"> mcp add Ael-Agents -- </tspan>
      <tspan fill="#9ca3af">python mcp_server.py</tspan>
    </text>
  </g>

  <!-- Animated Cursor Bar following typing progress -->
  <rect y="22" width="2.6" height="31" fill="#f3f4f6">
    <animate attributeName="x" values="165;648;648;165;165" keyTimes="0;0.42;0.82;0.94;1" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1;0;1;1" keyTimes="0;0.42;0.52;0.62;0.72;0.82;1" dur="7.5s" repeatCount="indefinite"/>
  </rect>
</svg>
